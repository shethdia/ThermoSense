services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thermosense
      POSTGRES_USER: thermosense
      POSTGRES_PASSWORD: thermosense
    ports:
      - "5432:5432"
    volumes:
      - thermosense-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermosense -d thermosense"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  thermosense-postgres:

